services:
  app:
    image: ghcr.io/bozonx/microservice-boilerplate:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: microservice-boilerplate
    hostname: microservice-boilerplate
    restart: unless-stopped
    # Reaps zombies and forwards signals, so the image needs no tini.
    init: true
    stop_grace_period: 30s
    ports:
      - '${LISTEN_PORT:-8080}:8080'
    # Paths are relative to this file, hence ../.env rather than .env.
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # This service is stateless: it writes nothing to disk, so it needs no volumes.
