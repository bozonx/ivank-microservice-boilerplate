name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read package metadata
        id: meta
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "APP_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "NODE_MAJOR=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        shell: bash

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gate developers run locally.
      - name: Check
        run: pnpm check

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO=ghcr.io/$OWNER/${{ steps.meta.outputs.APP_NAME }}" >> $GITHUB_OUTPUT
        shell: bash

      # The Dockerfile builds the project itself, so no dist/ is uploaded from this job.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NODE_MAJOR=${{ steps.meta.outputs.NODE_MAJOR }}
            APP_VERSION=${{ steps.meta.outputs.APP_VERSION }}
          tags: |
            ${{ steps.image.outputs.REPO }}:${{ steps.meta.outputs.APP_VERSION }}
            ${{ steps.image.outputs.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
